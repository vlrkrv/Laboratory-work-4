name: Program Code Convention
on:
  push:
    branches: [main]

jobs:
  JavaScriptCodeLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Biome
        run: npm install --save-dev --save-exact @biomejs/biome
        
      - name: Validate all js-file
        run: npx @biomejs/biome check --error-on-warnings ProgramCode.js
